name: lestudio-local
services:
  db:
    image: postgres:17.12-bookworm@sha256:40865bc877a289da75963d97d72b59633f639fc5af7a4e856bfa3714cae5b536
    environment:
      POSTGRES_DB: studio_db
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Générer .env avec python3 scripts/init_env.py}
      STUDIO_DB_PASSWORD: ${STUDIO_DB_PASSWORD:?Mot de passe applicatif requis}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/init-db.sql:/docker-entrypoint-initdb.d/10-studio.sql:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "studio_app", "-d", "studio_db"]
      interval: 3s
      timeout: 3s
      retries: 20

  web:
    build: .
    environment:
      STUDIO_PORTAL_ORIGIN: ${STUDIO_PORTAL_ORIGIN:-http://127.0.0.1:${STUDIO_PORT:-8000}}
      STUDIO_PORTAL_CONTACT: ${STUDIO_PORTAL_CONTACT:-}
      STUDIO_EDITOR_MODE: ${STUDIO_EDITOR_MODE:-coexistence}
      STUDIO_UI_GALLERY: ${STUDIO_UI_GALLERY:-1}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Clé Django requise}
      STUDIO_DB_PASSWORD: ${STUDIO_DB_PASSWORD:?Mot de passe applicatif requis}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${STUDIO_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health/', timeout=4).close()"]
      interval: 5s
      timeout: 5s
      retries: 15

  purge-depots:
    image: ${COMPOSE_PROJECT_NAME:-lestudio-local}-web
    pull_policy: never
    depends_on:
      web: {condition: service_healthy}
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Clé Django requise}
      STUDIO_DB_PASSWORD: ${STUDIO_DB_PASSWORD:?Mot de passe applicatif requis}
    command: ["sh", "-ec", "while :; do python manage.py purge_depots; python manage.py purge_apercus; sleep 3600; done"]
    restart: unless-stopped

volumes:
  pgdata:
