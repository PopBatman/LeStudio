events {}
http {
    map $ssl_client_s_dn $preview_operator {
        default 0;
        include /run/tls/preview-operators*.map;
    }
    access_log off;
    error_log /dev/stderr warn;
    server {
        listen 8443 ssl;
        server_name _;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_certificate /run/tls/server.crt;
        ssl_certificate_key /run/tls/server.key;
        ssl_client_certificate /run/tls/readers.pem;
        ssl_verify_client on;
        error_page 495 496 =403 /cert-refused;
        location = /cert-refused { internal; return 403; }
        ssl_session_cache off;
        ssl_session_tickets off;
        location ~ "^/internal/(identity|version|health|render|editorial/v1/article/[1-9][0-9]{0,9})$" {
            if ($request_method != GET) { return 405; }
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header Host localhost;
            proxy_pass http://engine:8000;
        }
        location = /internal/preview/v1/render {
            if ($request_method != POST) { return 405; }
            if ($preview_operator = 0) { return 403; }
            client_max_body_size 4m;
            client_body_timeout 5s;
            proxy_read_timeout 10s;
            proxy_set_header Host localhost;
            proxy_pass http://engine:8000;
        }
        location / { return 404; }
    }
}
