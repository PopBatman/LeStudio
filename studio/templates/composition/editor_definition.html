<form method="get" action="{{ request.path }}#inspecteur" class="ed-form"><input type="hidden" name="format" value="{{ format }}">{% if custom_width %}<input type="hidden" name="largeur" value="{{ custom_width }}">{% endif %}<input type="hidden" name="action" value="{{ action|default:'block_add' }}"><input type="hidden" name="page" value="{{ page_id }}"><input type="hidden" name="section" value="{{ section_id }}">{% if occurrence %}<input type="hidden" name="node" value="{{ node_id }}">{% endif %}
<label for="{{ selector_id|default:'ed-definition' }}">{% if action == 'block_edit' %}Version de remplacement{% else %}Composant à insérer{% endif %}</label><select id="{{ selector_id|default:'ed-definition' }}" name="definition" required>{% for entry in definitions %}<option value="{{ entry.id }}">{{ entry.label }} · {% if entry.scope == 'global' %}Global{% else %}Site{% endif %} · v{{ entry.version }}</option>{% endfor %}</select><button class="btn">{% if action == 'block_edit' %}Choisir cette version{% else %}Ajouter un composant{% endif %}</button></form>
