function button(name,fn,cls){const b=document.createElement('button');b.type='button';b.textContent=name;b.onclick=fn;if(cls)b.className=cls;return b}
function say(s){$('live').textContent=s}
function mutate(fn){previous.push({rows:structuredClone(rows),selected});next=[];fn();editing=null;pending=null;render()}
function history(from,to){if(!from.length)return;to.push({rows:structuredClone(rows),selected});const v=from.pop();rows=v.rows;selected=v.selected;editing=null;pending=null;render()}
function choose(id){selected=id;editing=null;render();$('nodes').querySelector('[aria-pressed=true]')?.focus()}
function start(p,mouse=false){editing=null;pending=p;drawNodes();$('guide').hidden=false;$('hint').textContent=p.kind==='add'?'Choisir un emplacement dans la section.':'Choisir la nouvelle position du bloc.';if(!mouse)$('nodes').querySelector('.target')?.focus()}
function place(i){if(!pending)return;const p=pending;
 if(p.kind==='move'&&(i===rows.findIndex(x=>x.id===p.id)||i===rows.findIndex(x=>x.id===p.id)+1)){pending=null;render();say('Position inchangée.');return}
 mutate(()=>{let block;if(p.kind==='add'){const c=catalogue.find(x=>x.k===p.k&&!x.off);if(!c)return;block=make(c.k,c.value)}else{const before=rows.findIndex(x=>x.id===p.id);block=rows.splice(before,1)[0];if(before<i)i--}
 rows.splice(i,0,block);selected=block.id});say('Placement appliqué à la saisie locale.');$('edit').focus()}
function target(i){const b=button(i===rows.length?'＋ En fin de section':'＋ Avant « '+rows[i].value+' »',()=>place(i),'target');b.ondragover=e=>{if(pending){e.preventDefault();b.classList.add('over')}};b.ondragleave=()=>b.classList.remove('over');b.ondrop=e=>{e.preventDefault();place(i)};return b}
function drawCatalog(){const a=$('catalog');a.replaceChildren();const q=$('search').value.trim().toLocaleLowerCase('fr');for(const c of catalogue.filter(c=>c.k.toLocaleLowerCase('fr').includes(q)&&($('category').value==='Toutes'||$('category').value===c.category))){const b=button('',()=>start({kind:'add',k:c.k}),'card');b.draggable=!c.off;b.disabled=!!c.off;

 a.append(b)}if(pending)a.append(target(rows.length))}

 $('selected').textContent=active()?.k||'Aucun bloc sélectionné';$('position').textContent=active()?(rows.indexOf(active())+1)+' sur '+rows.length:'—';
 $('format').textContent=$('size').selectedIndex?'Valeurs héritées · '+$('size').selectedOptions[0].text:'Valeurs de base';$('paper').style.maxWidth=$('size').value+'px';$('guide').hidden=!pending;
 $('revision').textContent='Atelier · Brouillon R'+revision;$('changes').textContent=dirty()?'Saisie locale à enregistrer':'Brouillon enregistré';$('undo').disabled=!previous.length;$('redo').disabled=!next.length;$('save').disabled=!dirty();for(const k of ['edit','move','copy','remove'])$(k).disabled=!active()}
$('edit').onclick=()=>openEdit(selected);$('move').onclick=()=>start({kind:'move',id:selected});$('copy').onclick=()=>mutate(()=>{const copy={...active(),id:crypto.randomUUID()};rows.splice(rows.indexOf(active())+1,0,copy);selected=copy.id});$('remove').onclick=()=>mutate(()=>{const i=rows.indexOf(active());rows.splice(i,1);selected=rows[Math.min(i,rows.length-1)]?.id||null});$('undo').onclick=()=>history(previous,next);$('redo').onclick=()=>history(next,previous);
$('cancel').onclick=()=>{pending=null;render();$('search').focus()};document.addEventListener('keydown',e=>{if(e.key==='Escape'&&pending)$('cancel').click()});
$('move').ondragstart=e=>{if(active()){e.dataTransfer.setData('text/plain',selected);start({kind:'move',id:selected},true)}};
$('search').oninput=drawCatalog;$('category').onchange=drawCatalog;$('size').onchange=render;
$('save').onclick=()=>{if(head!==revision){$('conflict').hidden=false;$('conflictMessage').textContent='La tête est R'+head+'. Votre saisie sur R'+revision+' est conservée.';$('keep').focus();return}revision=++head;stored=structuredClone(rows);previous=[];next=[];render();say('Brouillon enregistré en R'+revision+' dans la démonstration.')};
$('simulate').onclick=()=>{head=revision+1;say('Une autre session a enregistré R'+head+'.')};$('keep').onclick=()=>{$('conflict').hidden=true;$('save').focus()};$('reload').onclick=()=>{revision=head;rows=structuredClone(stored);selected=rows[0]?.id;previous=[];next=[];pending=null;editing=null;$('conflict').hidden=true;render();say('Révision courante rechargée dans la démonstration.')};
$('toggleNav').onclick=()=>{const on=$('nav').classList.toggle('expanded');$('toggleNav').setAttribute('aria-expanded',String(on))};
render();
